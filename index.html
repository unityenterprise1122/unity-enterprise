<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity Enterprise হিসাব সফটওয়্যার</title>
<style>
:root{--navy:#123b65;--blue:#1769aa;--bg:#f2f5f9;--white:#fff;--text:#243447;--muted:#64748b;--border:#dce4ee;--green:#e0f5e9;--red:#fde8e8;--gold:#fff4d6}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;color:var(--text);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:16px 22px}header h1{margin:0;font-size:23px}header p{margin:6px 0 0;font-size:14px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 80px)}nav{background:#fff;padding:12px;border-right:1px solid var(--border)}
nav button{width:100%;text-align:left;padding:11px;margin-bottom:5px;background:#fff;border:1px solid transparent;border-radius:7px;cursor:pointer;font-size:15px;color:var(--text)}
nav button:hover,nav button.active{background:#e8f1fb;border-color:#c7d9ef;color:var(--navy);font-weight:bold}
main{padding:22px;min-width:0}h2{margin-top:0}.panel,.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:17px;margin-bottom:16px;box-shadow:0 2px 5px #00000008}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card p{color:var(--muted);margin:0 0 9px}.card strong{font-size:22px}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;background:#fff}input[type=checkbox]{width:auto}
button.primary,button.secondary,button.danger{border:0;border-radius:6px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:600}
button.primary{background:var(--blue);color:#fff}button.secondary{background:#e8eef5;color:#123b65}button.danger{background:#fde8e8;color:#9f1239}
.table-wrap{overflow:auto;max-width:100%}table{width:100%;border-collapse:collapse;min-width:1100px;table-layout:auto}th,td{border:1px solid var(--border);padding:9px;text-align:left;vertical-align:middle}th{background:#edf3f9;white-space:nowrap}td input{width:150px;min-width:130px;padding:7px}#dailyTable th:first-child,#dailyTable td:first-child{min-width:170px}#dailyTable th:nth-child(2),#dailyTable th:nth-child(3),#dailyTable th:nth-child(4),#dailyTable th:nth-child(5),#dailyTable th:nth-child(6){min-width:155px}#dailyTable th:last-child,#dailyTable td:last-child{min-width:190px}.right{text-align:right}.muted{color:var(--muted)}.status,.message{padding:10px 12px;border-radius:7px;margin:10px 0;background:#edf3f9}.success{background:var(--green);color:#166534}.error{background:var(--red);color:#991b1b}.warning{background:var(--gold);color:#854d0e}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:13px}.hidden{display:none!important}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.summary span{background:#edf3f9;padding:8px 12px;border-radius:7px}.login-box{max-width:440px;margin:35px auto}.login-box input{margin-bottom:10px}
@media(max-width:850px){.layout{grid-template-columns:1fr}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;border-right:0;border-bottom:1px solid var(--border)}nav button{margin:0;font-size:13px}main{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{header,nav,#connectionStatus,.no-print,button{display:none!important}.layout{display:block}main{padding:0}.panel,.card{box-shadow:none;break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<header><h1>Unity Enterprise</h1><p>আইসক্রিম ডিলারশিপ হিসাব ব্যবস্থাপনা</p></header>
<div id="loginArea" class="panel login-box hidden">

<form id="loginForm"><label>ইমেইল</label><input id="loginEmail" type="email" required autocomplete="username"><label>পাসওয়ার্ড</label><input id="loginPassword" type="password" required autocomplete="current-password"><button class="primary" type="submit">লগইন করুন</button></form><div id="loginMessage" class="message"></div>

<button data-page="products">🍦 পণ্য</button><button data-page="stock">📦 গোডাউন স্টক</button><button data-page="vehicles">🚚 গাড়ি/ড্রাইভার</button>
<button data-page="expenses">💳 খরচ</button><button data-page="partners">🤝 অংশীদার</button><button id="logoutButton">🚪 লগআউট</button>
</nav>
<main><div class="actions no-print" style="justify-content:flex-end"><button class="secondary" id="refreshButton">তথ্য রিফ্রেশ</button><button class="secondary" onclick="window.print()">প্রিন্ট / PDF</button></div><h2 id="pageTitle">ড্যাশবোর্ড</h2><div id="pageContent"></div><div id="connectionStatus" class="status">ডেটাবেস সংযোগ পরীক্ষা হচ্ছে...</div></main>
</div>

async function loadBaseData(){
 const [s,v]=await Promise.all([
 db.from("stores").select("id,store_name,owner_name,opening_balance,is_active").order("store_name"),
 db.from("vehicles").select("*").order("id")
 ]);
 if(s.error)throw new Error("দোকানের তালিকা: "+s.error.message);

}
function vehicleLabel(v){return v.vehicle_name||v.driver_name||v.name||v.registration_number||v.registration_num||v.title||("ড্রাইভার/গাড়ি #"+v.id)}
function vehicleOptions(selected=""){return `<option value="">ড্রাইভার নির্বাচন করুন</option>`+vehicles.map(v=>`<option value="${v.id}" ${String(selected)===String(v.id)?"selected":""}>${esc(vehicleLabel(v))}</option>`).join("")}
function storeOptions(){return stores.map(s=>`<option value="${s.id}">${esc(s.store_name)}${s.owner_name?" — "+esc(s.owner_name):""}</option>`).join("")}
async function navigate(key){currentPage=key;const labels={home:"ড্যাশবোর্ড",stores:"দোকান",daily:"ড্রাইভারের দৈনিক হিসাব",reports:"দৈনিক/মাসিক রিপোর্ট",settlement:"ড্রাইভারের ক্যাশ সেটেলমেন্ট",products:"পণ্য",stock:"গোডাউন স্টক",vehicles:"গাড়ি/ড্রাইভার",expenses:"খরচ",partners:"অংশীদার"};title.textContent=labels[key]||"হিসাব";document.querySelectorAll("#menu button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===key));try{await loadBaseData();if(key==="home")await renderHome();else if(key==="stores")await renderStores();else if(key==="daily")await renderDaily();else if(key==="reports")await renderReports();else if(key==="settlement")await renderSettlement();else if(key==="vehicles")renderVehicles();else renderSimple(key);setStatus("Supabase সংযোগ সফল।","success")}catch(e){pageShell(`<section class="panel"><div class="message error">${esc(e.message)}</div><p>Supabase টেবিল/কলামের নাম ও RLS অনুমতি যাচাই করুন।</p></section>`);setStatus("ডেটা লোডে সমস্যা: "+e.message,"error");console.error(e)}}
async function renderHome(){
 const todayDate=t(), month=todayDate.slice(0,7);
 const [{data:dailyData,error:dailyError},{data:allStoreRows,error:storeError}] = await Promise.all([
   db.from("daily_shop_entries").select("entry_date,store_id,vehicle_id,sales_amount,today_collection,old_due_collection"),
   db.from("stores").select("id,opening_balance,is_active")
 ]);
 if(dailyError) throw new Error("দৈনিক হিসাব লোড হয়নি: "+dailyError.message);
 if(storeError) throw new Error("দোকানের হিসাব লোড হয়নি: "+storeError.message);

 const rows=dailyData||[];
 const activeStores=(allStoreRows||[]).filter(s=>s.is_active!==false);
 const todays=rows.filter(r=>r.entry_date===todayDate);
 const monthRows=rows.filter(r=>String(r.entry_date||"").startsWith(month));
 const salesToday=todays.reduce((a,r)=>a+num(r.sales_amount),0);
 const collectedToday=todays.reduce((a,r)=>a+num(r.today_collection)+num(r.old_due_collection),0);
 const newDueToday=todays.reduce((a,r)=>a+num(r.sales_amount)-num(r.today_collection),0);
 const totalDue=activeStores.reduce((a,s)=>a+num(s.opening_balance),0)+rows.reduce((a,r)=>a+num(r.sales_amount)-num(r.today_collection)-num(r.old_due_collection),0);
 const salesMonth=monthRows.reduce((a,r)=>a+num(r.sales_amount),0);
 const collectedMonth=monthRows.reduce((a,r)=>a+num(r.today_collection)+num(r.old_due_collection),0);
 const incompleteToday=todays.length===0;
 const unsupported="এই হিসাবের ডেটাবেস সংযোগ যাচাই/যুক্ত করা বাকি";
 const card=(label,value,sub="")=>`<div class="card"><p>${esc(label)}</p><strong>${value}</strong>${sub?`<div class="small muted" style="margin-top:7px">${esc(sub)}</div>`:""}</div>`;
 pageShell(`
 <section class="panel">
   <div class="actions" style="justify-content:space-between;align-items:center">
    <div><h3 style="margin:0">ব্যবসার সার্বিক অবস্থা</h3><p class="muted small" style="margin:5px 0 0">তারিখ: ${esc(todayDate)} · মাস: ${esc(month)}</p></div>
    <button class="secondary no-print" onclick="window.goPage('reports')">রিপোর্ট দেখুন</button>
   </div>
 </section>
 <div class="cards">
  ${card("আজকের মোট বিক্রি",money(salesToday),`এই মাসে: ${money(salesMonth)}`)}
  ${card("আজ মোট আদায়",money(collectedToday),`এই মাসে: ${money(collectedMonth)}`)}
  ${card("আজকের নতুন বাকি (হিসাবি)",money(newDueToday),"বিক্রি − আজকের বিক্রির আদায়")}
  ${card("দোকানের কাছে মোট পাওনা",money(totalDue),"শুরুর বাকি ও দৈনিক এন্ট্রি থেকে হিসাব")}
  ${card("সক্রিয় দোকান",String(activeStores.length))}
  ${card("আজকের হিসাব",incompleteToday?"এখনো এন্ট্রি নেই":"এন্ট্রি পাওয়া গেছে",incompleteToday?"আজকের দৈনিক হিসাব অসম্পূর্ণ হতে পারে":"এন্ট্রি আছে; সব দোকান/গাড়ি সম্পূর্ণ কি না যাচাই করুন")}
 </div>
 <section class="panel">
  <h3>অন্যান্য গুরুত্বপূর্ণ হিসাব</h3>
  <div class="cards">
   ${card("অফিসের নগদ", "যাচাই বাকি", unsupported)}
   ${card("কোম্পানির ইনসেনটিভ", "যাচাই বাকি", unsupported)}
   ${card("আজ / মাসের খরচ", "যাচাই বাকি", unsupported)}
   ${card("স্টক ও নষ্ট পণ্য", "যাচাই বাকি", unsupported)}
   ${card("লাভ-ক্ষতি", "যাচাই বাকি", "ক্রয়মূল্য, বিক্রি ও খরচের নির্ভরযোগ্য ডেটা সংযুক্ত করা বাকি")}
   ${card("মালিকের কাছে নিরাপত্তার টাকা", "যাচাই বাকি", unsupported)}
  </div>
  <p class="small muted">গুরুত্বপূর্ণ: যেসব হিসাবের নির্ভরযোগ্য টেবিল/কলাম এখনো যাচাই করা হয়নি, সেগুলোতে ভুল সংখ্যা দেখানোর বদলে “যাচাই বাকি” দেখানো হচ্ছে। ডেটাবেস যাচাইয়ের পর সেগুলো সংযুক্ত করা হবে।</p>
 </section>
 <section class="panel">
  <h3>দ্রুত কাজ</h3>
  <div class="actions">
   <button class="primary" onclick="window.goPage('daily')">দৈনিক হিসাব লিখুন</button>
   <button class="secondary" onclick="window.goPage('settlement')">ক্যাশ সেটেলমেন্ট</button>
   <button class="secondary" onclick="window.goPage('stores')">দোকানের হিসাব</button>
   <button class="secondary" onclick="window.goPage('reports')">রিপোর্ট</button>
  </div>
 </section>`);
}
async function renderStores(){
 const {data,error}=await db.from("stores").select("id,store_name,owner_name,phone,address,opening_balance,is_active").order("store_name");
 if(error)throw error;stores=(data||[]).filter(x=>x.is_active!==false);
 pageShell(`<section class="panel"><h3>নতুন দোকান যোগ করুন</h3><form id="storeForm" class="form-grid"><div><label>দোকানের নাম *</label><input id="storeName" required></div><div><label>মালিকের নাম</label><input id="storeOwner"></div><div><label>শুরুর বাকি (৳)</label><input id="storeBalance" type="number" min="0" step=".01" value="0"></div><div><button class="primary">দোকান সংরক্ষণ করুন</button></div></form><div id="storeMsg" class="message"></div></section><section class="panel"><h3>দোকানের তালিকা (${stores.length})</h3><div class="table-wrap"><table><thead><tr><th>দোকান</th><th>মালিক</th><th>শুরুর বাকি</th><th>বর্তমান বাকি*</th></tr></thead><tbody>${stores.map(s=>`<tr><td>${esc(s.store_name)}</td><td>${esc(s.owner_name||"—")}</td><td>${money(s.opening_balance)}</td><td id="due-${s.id}">হিসাব হচ্ছে…</td></tr>`).join("")||'<tr><td colspan="4">কোনো দোকান নেই</td></tr>'}</tbody></table></div><p class="small muted">*বর্তমান বাকি দৈনিক হিসাব থেকে হিসাব করা হয়। একই দোকানের একাধিক ড্রাইভার এন্ট্রি করলে দোকানের বাকি একত্রে দেখাবে।</p></section>`);
 $("storeForm").addEventListener("submit",saveStore);
 const {data:all,error:e}=await db.from("daily_shop_entries").select("store_id,sales_amount,today_collection,old_due_collection");
 if(e)throw e;
 stores.forEach(s=>{const d=num(s.opening_balance)+(all||[]).filter(r=>String(r.store_id)===String(s.id)).reduce((a,r)=>a+num(r.sales_amount)-num(r.today_collection)-num(r.old_due_collection),0);const el=$("due-"+s.id);if(el)el.textContent=money(d)});
}
async function saveStore(e){
  e.preventDefault();
  const storeName=$("storeName").value.trim();
  const ownerName=$("storeOwner").value.trim();
  const row={store_name:storeName,owner_name:ownerName||null,opening_balance:num($("storeBalance").value),is_active:true};

  if(!storeName){
    msg("storeMsg","দোকানের নাম লিখুন।","error");
    return;
  }

  // Warn about likely duplicates without changing or deleting any existing data.
  const {data:matches,error:checkError}=await db.from("stores")
    .select("id,store_name,owner_name,phone")
    .ilike("store_name",storeName)
    .limit(10);
  if(checkError){
    msg("storeMsg","দোকানের নাম যাচাই করা যায়নি: "+checkError.message+"। নিরাপত্তার জন্য সংরক্ষণ বন্ধ রাখা হয়েছে।","error");
    return;
  }
  if(matches && matches.length){
    const sameOwner=matches.some(s=>(s.owner_name||"").trim().toLocaleLowerCase()===(ownerName||"").trim().toLocaleLowerCase());
    if(sameOwner){
      msg("storeMsg","এই নাম ও মালিকের দোকান আগে থেকেই আছে। তালিকা যাচাই করুন; পুরোনো তথ্য মুছে ফেলা হয়নি।","error");
      return;
    }
    if(!confirm("একই নামে দোকান আগে থেকেই আছে। তবুও কি নতুন দোকান যোগ করবেন?")) return;
  }

  const {error}=await db.from("stores").insert(row);
  if(error){msg("storeMsg","সংরক্ষণ হয়নি: "+error.message,"error");return}

   <div><label>ছাড় (৳)</label><input id="discountAmount" type="number" min="0" step=".01" value="${num(r.discount_amount)}"></div>
   <div><label>নষ্ট আইসক্রিমের ক্রয়মূল্য (৳)</label><input id="damagedCost" type="number" min="0" step=".01" value="${num(r.damaged_goods_cost)}"></div>
   <div><label>ড্রাইভার বাস্তবে জমা দিয়েছে (৳)</label><input id="actualDeposit" type="number" min="0" step=".01" value="${num(r.actual_deposit)}"></div>
   <div><label>নোট</label><input id="settleNotes" value="${esc(r.notes||"")}" placeholder="মেরামতের বিবরণ ইত্যাদি"></div>
  </div>
  <p class="small muted">হিসাবের নিয়ম: ছাড় ও নষ্ট আইসক্রিমের মূল্য দোকানের মেমোতেই সমন্বয় হবে। তাই আদায় করা নগদ থেকে এগুলো আবার বাদ হবে না; নগদ থেকে শুধু গাড়ি মেরামতের খরচ বাদ হবে, যদি সেটি এই নগদ থেকে দেওয়া হয়।</p><div class="summary"><span>জমা দেওয়ার কথা: <b id="expectedDeposit">${money(cash-num(r.repair_cost))}</b></span><span>পার্থক্য (বাস্তব জমা − জমা দেওয়ার কথা): <b id="settleDifference">${money(num(r.actual_deposit)-(cash-num(r.repair_cost)))}</b></span></div>
  <div class="actions no-print"><button class="primary" id="saveSettlement">ক্যাশ সেটেলমেন্ট সংরক্ষণ</button></div><div id="saveSettleMsg" class="message"></div>
  <p class="small muted">ধনাত্মক পার্থক্য = বেশি জমা, ঋণাত্মক পার্থক্য = কম জমা। নষ্ট পণ্যের মূল্য ক্রয়মূল্যে লিখুন।</p>`;
  $("settleFormArea").dataset.cash=String(cash);
  ["repairCost","discountAmount","damagedCost","actualDeposit"].forEach(id=>$(id).addEventListener("input",updateSettlementTotals));
  $("saveSettlement").addEventListener("click",saveSettlement);
  msg("settleMsg",`দৈনিক হিসাব থেকে ${rows.length}টি দোকানের এন্ট্রি পাওয়া গেছে। ${existing.data?"আগের সেটেলমেন্ট লোড হয়েছে; পরিবর্তন করে সংরক্ষণ করতে পারবেন.":"নতুন সেটেলমেন্ট তৈরি করুন."}`,"success");
 }catch(e){msg("settleMsg","হিসাব লোড হয়নি: "+e.message,"error");console.error(e)}
}
function updateSettlementTotals(){
  // Read the cash total stored when the daily settlement form was loaded.
  const cash=num($("settleFormArea").dataset.cash);
  const repair=num($("repairCost").value);
  const actual=num($("actualDeposit").value);
  // Discount and damaged-goods amounts are already handled in the daily memo.
  // Only repair costs paid from the collected cash reduce the expected deposit.
  const expected=cash-repair;
  $("expectedDeposit").textContent=money(expected);
  $("settleDifference").textContent=money(actual-expected);
}
async function saveSettlement(){
 const date=$("settleDate").value,vid=$("settleVehicle").value,cash=num($("settleFormArea").dataset.cash);
 const repair=num($("repairCost").value),discount=num($("discountAmount").value),damaged=num($("damagedCost").value),actual=num($("actualDeposit").value);
 if([repair,discount,damaged,actual].some(x=>x<0)){msg("saveSettleMsg","টাকার অঙ্ক ঋণাত্মক হতে পারবে না।","error");return}
 const expected=cash-repair;
 if(expected<0){msg("saveSettleMsg","খরচ, ছাড় ও নষ্ট পণ্যের মোট মূল্য মোট নগদ আদায়ের চেয়ে বেশি। অঙ্কগুলো যাচাই করুন।","error");return}
 const row={settlement_date:date,vehicle_id:Number(vid),total_cash_collected:cash,repair_cost:repair,discount_amount:discount,damaged_goods_cost:damaged,expected_deposit:expected,actual_deposit:actual,difference:actual-expected,notes:$("settleNotes").value.trim()||null};
 const {error}=await db.from("driver_settlements").upsert(row,{onConflict:"settlement_date,vehicle_id"});
 if(error){msg("saveSettleMsg","সংরক্ষণ হয়নি: "+error.message,"error");return}
 msg("saveSettleMsg","ক্যাশ সেটেলমেন্ট সংরক্ষণ হয়েছে। একই তারিখ ও ড্রাইভার খুলে পরে সংশোধন করা যাবে।","success");
 await loadSettlementHistory();
}
async function loadSettlementHistory(){
 const from=$("settleFrom")?.value||today().slice(0,8)+"01",to=$("settleTo")?.value||today(),vid=$("settleFilter")?.value||"";
 let q=db.from("driver_settlements").select("*").gte("settlement_date",from).lte("settlement_date",to).order("settlement_date",{ascending:false});
 if(vid)q=q.eq("vehicle_id",vid);
 const {data,error}=await q;
 if(error){if($("settleHistory"))$("settleHistory").innerHTML=`<div class="message error">${esc(error.message)}</div>`;return}
 const names=new Map(vehicles.map(v=>[String(v.id),vehicleLabel(v)]));
 $("settleHistory").innerHTML=`<div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>ড্রাইভার</th><th>মোট আদায়</th><th>মেরামত</th><th>ছাড়</th><th>নষ্ট পণ্য</th><th>জমা দেওয়ার কথা</th><th>বাস্তব জমা</th><th>পার্থক্য</th><th>কাজ</th></tr></thead><tbody>${(data||[]).map(r=>`<tr><td>${esc(r.settlement_date)}</td><td>${esc(names.get(String(r.vehicle_id))||("#"+r.vehicle_id))}</td><td>${money(r.total_cash_collected)}</td><td>${money(r.repair_cost)}</td><td>${money(r.discount_amount)}</td><td>${money(r.damaged_goods_cost)}</td><td>${money(r.expected_deposit)}</td><td>${money(r.actual_deposit)}</td><td>${money(r.difference)}</td><td><button class="secondary" onclick="window.editSettlement('${r.settlement_date}','${r.vehicle_id}')">খুলুন / সংশোধন</button></td></tr>`).join("")||'<tr><td colspan="10">এই সময়ের কোনো সেটেলমেন্ট নেই।</td></tr>'}</tbody></table></div>`;
}

function renderVehicles(){pageShell(`<section class="panel"><h3>গাড়ি / ড্রাইভার তালিকা</h3><p>নতুন ড্রাইভার যোগ করতে Supabase-এর <b>vehicles</b> টেবিলে নতুন row যোগ করুন এবং সক্রিয় রাখুন। দৈনিক হিসাবের ড্রপডাউনে সক্রিয় গাড়ি/ড্রাইভারগুলো দেখাবে।</p><div class="table-wrap"><table><thead><tr><th>ID</th><th>নাম</th><th>রেজিস্ট্রেশন</th><th>সক্রিয়</th></tr></thead><tbody>${vehicles.map(v=>`<tr><td>${esc(v.id)}</td><td>${esc(vehicleLabel(v))}</td><td>${esc(v.registration_number||v.registration_num||"—")}</td><td>${v.is_active===false?"না":"হ্যাঁ"}</td></tr>`).join("")||'<tr><td colspan="4">কোনো সক্রিয় গাড়ি/ড্রাইভার পাওয়া যায়নি।</td></tr>'}</tbody></table></div><p class="small muted">যদি নামের বদলে “ড্রাইভার/গাড়ি #1” দেখায়, vehicles টেবিলের নামের কলামটি কী নামে আছে তা জানাতে হবে।</p></section>`)}
function renderSimple(key){const names={products:"পণ্য",stock:"গোডাউন স্টক",expenses:"খরচ",partners:"অংশীদার"};pageShell(`<section class="panel"><h3>${names[key]||key}</h3><p>এই মডিউলের পূর্ণ ফর্ম পরের ধাপে যুক্ত হবে। বর্তমানে চালু আছে দোকান, ড্রাইভার/গাড়ি নির্বাচন, দোকানভিত্তিক দৈনিক বিক্রি-আদায়, সংরক্ষিত হিসাব সংশোধন এবং রিপোর্ট।</p></section>`)}
window.goPage=k=>navigate(k);window.editSettlement=(date,vid)=>{navigate("settlement").then(()=>{ $("settleDate").value=date; $("settleVehicle").value=vid; loadSettlementForm(); });};window.editDaily=(date,vid)=>{editingDate=date;editingVehicle=vid;navigate("daily")};
async function startApp(){try{await loadBaseData();setStatus("Supabase সংযোগ সফল।","success");await navigate("home")}catch(e){setStatus("সংযোগ/টেবিল সমস্যা: "+e.message,"error");console.error(e)}}
async function init(){if(!window.supabase?.createClient){setStatus("Supabase লাইব্রেরি লোড হয়নি। ইন্টারনেট পরীক্ষা করুন।","error");return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")authState()});await authState()}
init();
})();
</script>
