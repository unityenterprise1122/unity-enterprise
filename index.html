
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unity Enterprise হিসাব সফটওয়্যার</title>
  <style>
    :root {
      --navy: #123b65;
      --blue: #1769aa;
      --bg: #f2f5f9;
      --white: #ffffff;
      --text: #243447;
      --muted: #64748b;
      --border: #dce4ee;
      --green: #d1e7dd;
      --red: #f8d7da;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 18px 22px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .9;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: calc(100vh - 85px);
    }

    nav {
      background: #fff;
      padding: 14px;
      border-right: 1px solid var(--border);
    }

    nav button {
      width: 100%;
      display: block;
      text-align: left;
      padding: 12px;
      margin-bottom: 6px;
      background: white;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      color: var(--text);
    }

    nav button:hover,
    nav button.active {
      background: #e8f1fb;
      border-color: #c7d9ef;
      color: var(--navy);
      font-weight: bold;
    }

    main { padding: 24px; min-width: 0; }

    h2 { margin-top: 0; }

    .panel, .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 5px #00000008;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .card p { color: var(--muted); margin: 0 0 10px; }
    .card strong { font-size: 24px; }

    label {
      display: block;
      margin: 13px 0 5px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
      background: white;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid #b8d7f5;
      border-color: var(--blue);
    }

    .btn {
      display: inline-block;
      border: 0;
      border-radius: 6px;
      background: var(--navy);
      color: white;
      padding: 11px 16px;
      margin: 12px 6px 0 0;
      cursor: pointer;
      font: inherit;
    }

    .btn:hover { background: var(--blue); }
    .btn.secondary { background: #526579; }

    .message {
      padding: 10px;
      border-radius: 6px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .message:empty { display: none; }
    .message.success { background: var(--green); }
    .message.error { background: var(--red); }
    .muted { color: var(--muted); }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 500px;
    }

    th, td {
      text-align: left;
      padding: 11px;
      border-bottom: 1px solid var(--border);
    }

    th { background: #edf3f9; }

    .status {
      margin-top: 12px;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      nav button { margin: 0; font-size: 13px; }
      main { padding: 14px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header h1 { font-size: 20px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Unity Enterprise</h1>
    <p>আইসক্রিম ডিলারশিপ হিসাব ব্যবস্থাপনা</p>
  </header>

  <div class="layout">
    <nav id="menu">
      <button class="active" data-page="home">🏠 ড্যাশবোর্ড</button>
      <button data-page="stores">🏪 দোকান</button>
      <button data-page="products">🍦 পণ্য</button>
      <button data-page="stock">📦 গোডাউন স্টক</button>
      <button data-page="vehicles">🚚 গাড়ি</button>
      <button data-page="deliveries">🧾 ডেলিভারি</button>
      <button data-page="payments">💵 টাকা আদায়</button>
      <button data-page="expenses">💳 খরচ</button>
      <button data-page="partners">🤝 অংশীদার</button>
      <button data-page="reports">📊 রিপোর্ট</button>
    </nav>

    <main>
      <h2 id="pageTitle">ড্যাশবোর্ড</h2>
      <div id="pageContent"></div>
      <div id="connectionStatus" class="status">
        ডেটাবেস সংযোগ পরীক্ষা হচ্ছে...
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (() => {
    "use strict";

    const SUPABASE_URL = "https://yprcaiyftfqvkibehxtb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4dmw6mBMWeHWBY98qezleg_JCHd-Bm5";

    const title = document.getElementById("pageTitle");
    const content = document.getElementById("pageContent");
    const connectionStatus = document.getElementById("connectionStatus");
    const menu = document.getElementById("menu");

    const pages = {
      home: ["ড্যাশবোর্ড", "ব্যবসার সার্বিক হিসাব"],
      stores: ["দোকান", "দোকান যোগ করুন এবং দোকানের তালিকা দেখুন"],
      products: ["পণ্য", "পণ্যের নাম, ফ্লেভার, কার্টন ও মূল্য"],
      stock: ["গোডাউন স্টক", "প্রারম্ভিক স্টক, ক্রয়, ফেরত ও নষ্ট পণ্যের হিসাব"],
      vehicles: ["গাড়ি", "ডেলিভারি গাড়ির তথ্য"],
      deliveries: ["ডেলিভারি", "দোকান, গাড়ি ও পণ্য সরবরাহের হিসাব"],
      payments: ["টাকা আদায়", "দোকানের কাছ থেকে আদায় করা টাকা"],
      expenses: ["খরচ", "গাড়ির তেল, মেরামত ও অন্যান্য খরচ"],
      partners: ["অংশীদার", "মূলধন, জমা ও উত্তোলনের হিসাব"],
      reports: ["রিপোর্ট", "দৈনিক বিক্রি, বাকি ও লাভ-ক্ষতির রিপোর্ট"]
    };

    let db = null;
    let currentPage = "home";

    function showMessage(element, message, type = "") {
      element.textContent = message;
      element.className = "message" + (type ? " " + type : "");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function money(value) {
      return Number(value || 0).toLocaleString("en-BD", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function renderHome() {
      content.innerHTML = `
        <div class="cards">
          <div class="card"><p>মোট দোকান</p><strong id="totalStores">—</strong></div>
          <div class="card"><p>পণ্যের ধরন</p><strong>—</strong></div>
          <div class="card"><p>আজকের বিক্রি</p><strong>৳ —</strong></div>
          <div class="card"><p>দোকানে মোট বাকি</p><strong>৳ —</strong></div>
        </div>
        <div class="panel">
          <h3>স্বাগতম</h3>
          <p>Unity Enterprise হিসাব ব্যবস্থাপনায় স্বাগতম।</p>
          <p class="muted">বাস্তব বিক্রি, স্টক ও বাকি দেখানোর জন্য সংশ্লিষ্ট মডিউল ও হিসাবের নিয়ম সম্পূর্ণ করতে হবে।</p>
        </div>`;
      loadStoreCount();
    }

    function renderStores() {
      content.innerHTML = `
        <section class="panel">
          <h3>নতুন দোকান যোগ করুন</h3>
          <form id="storeForm">
            <label for="storeName">দোকানের নাম *</label>
            <input id="storeName" required maxlength="150" autocomplete="organization">

            <label for="storeOwner">মালিকের নাম</label>
            <input id="storeOwner" maxlength="150">
            
<label for="storeAddress">দোকানের ঠিকানা</label>
<textarea id="storeAddress" maxlength="500" rows="3" placeholder="দোকানের সম্পূর্ণ ঠিকানা লিখুন"></textarea>


            <label for="storeBalance">শুরুর বাকি (টাকা)</label>
            <input id="storeBalance" type="number" min="0" step="0.01" value="0" required>

            <button class="btn" type="submit">দোকান সংরক্ষণ করুন</button>
            <button class="btn secondary" type="button" id="refreshStores">তালিকা রিফ্রেশ করুন</button>
          </form>
          <div id="storeMessage" class="message" role="status"></div>
        </section>

        <section class="panel">
          <h3>দোকানের তালিকা</h3>
          <p class="muted">ডেটাবেসে সংরক্ষিত দোকানগুলো এখানে দেখা যাবে।</p>
          <div id="storeListMessage" class="message" role="status"></div>
          <div class="table-wrap">
            <table>
             
<thead>
  <tr>
    <th>দোকানের নাম</th>
    <th>মালিক</th>
    <th>দোকানের ঠিকানা</th>
    <th>শুরুর বাকি</th>
  </tr>
</thead>

              <tbody id="storeList">
                <tr><td colspan="3">তালিকা লোড হচ্ছে...</td></tr>
              </tbody>
            </table>
          </div>
        </section>`;

      document.getElementById("storeForm").addEventListener("submit", saveStore);
      document.getElementById("refreshStores").addEventListener("click", loadStores);
      loadStores();
    }

 
async function saveStore(event) {
  event.preventDefault();

  const form = event.currentTarget;
  const message = document.getElementById("storeMessage");
  const button = form.querySelector('button[type="submit"]');

  if (!db) {
    showMessage(message, "ডেটাবেস সংযুক্ত নয়। সংযোগ পরীক্ষা করুন।", "error");
    return;
  }

  const storeName = document.getElementById("storeName").value.trim();
  const ownerName = document.getElementById("storeOwner").value.trim();
  const address = document.getElementById("storeAddress").value.trim();
  const balance = Number(document.getElementById("storeBalance").value);

  if (!storeName) {
    showMessage(message, "দোকানের নাম লিখুন।", "error");
    return;
  }

  if (!Number.isFinite(balance) || balance < 0) {
    showMessage(message, "শুরুর বাকি সঠিকভাবে লিখুন।", "error");
    return;
  }

  button.disabled = true;
  showMessage(message, "দোকান সংরক্ষণ হচ্ছে...");

  try {
    const store = {
      store_name: storeName,
      owner_name: ownerName || null,
      address: address || null,
      opening_balance: balance,
      is_active: true
    };

    const { error } = await db.from("stores").insert(store);

    if (error) throw error;

    form.reset();
    document.getElementById("storeBalance").value = "0";
    showMessage(message, "দোকান সফলভাবে সংরক্ষিত হয়েছে।", "success");
    await loadStores();
    await loadStoreCount();
  } catch (error) {
    console.error("Save store error:", error);
    showMessage(message, "সংরক্ষণ হয়নি: " + (error.message || "অজানা সমস্যা"), "error");
  } finally {
    button.disabled = false;
  }
}

    
async function loadStores() {
  const list = document.getElementById("storeList");
  const message = document.getElementById("storeListMessage");
  if (!list || !message) return;

  list.replaceChildren();

  if (!db) {
    list.innerHTML = '<tr><td colspan="4">ডেটাবেস সংযুক্ত নয়।</td></tr>';
    showMessage(message, "Supabase সংযোগ তৈরি হয়নি।", "error");
    return;
  }

  showMessage(message, "দোকানের তালিকা লোড হচ্ছে...");

  try {
    const { data, error } = await db
      .from("stores")
      .select("store_name, owner_name, address, opening_balance")
      .order("store_name", { ascending: true });

    if (error) throw error;

    if (!data || data.length === 0) {
      list.innerHTML = '<tr><td colspan="4">এখনও কোনো দোকান যোগ করা হয়নি।</td></tr>';
      showMessage(message, "মোট দোকান: 0", "success");
      return;
    }

    data.forEach(store => {
      const row = document.createElement("tr");

      const nameCell = document.createElement("td");
      nameCell.textContent = store.store_name || "";

      const ownerCell = document.createElement("td");
      ownerCell.textContent = store.owner_name || "উল্লেখ নেই";

      const addressCell = document.createElement("td");
      addressCell.textContent = store.address || "উল্লেখ নেই";

      const balanceCell = document.createElement("td");
      balanceCell.textContent = "৳ " + money(store.opening_balance);

      row.append(nameCell, ownerCell, addressCell, balanceCell);
      list.appendChild(row);
    });

    showMessage(message, "মোট দোকান: " + data.length, "success");
  } catch (error) {
    console.error("Load stores error:", error);
    list.innerHTML = '<tr><td colspan="4">তালিকা আনা যায়নি।</td></tr>';
    showMessage(message, "তালিকা লোড হয়নি: " + (error.message || "অজানা সমস্যা"), "error");
  }
}

    async function loadStoreCount() {
      const total = document.getElementById("totalStores");
      if (!total || !db) return;

      try {
        const { count, error } = await db
          .from("stores")
          .select("*", { count: "exact", head: true });

        if (error) throw error;
        total.textContent = count ?? 0;
      } catch (error) {
        console.error("Store count error:", error);
        total.textContent = "—";
      }
    }

    function renderPlaceholder(pageKey) {
      const page = pages[pageKey];
      content.innerHTML = `
        <section class="panel">
          <h3>${escapeHtml(page[0])}</h3>
          <p>${escapeHtml(page[1])}</p>
          <p class="muted">এই মডিউলের পূর্ণ ফর্ম, ডেটাবেস সংরক্ষণ এবং রিপোর্টিং লজিক এখনও যোগ করা হয়নি।</p>
        </section>`;
    }

    function navigate(pageKey) {
      if (!pages[pageKey]) return;

      currentPage = pageKey;
      title.textContent = pages[pageKey][0];

      menu.querySelectorAll("button[data-page]").forEach(button => {
        const active = button.dataset.page === pageKey;
        button.classList.toggle("active", active);
        button.setAttribute("aria-current", active ? "page" : "false");
      });

      if (pageKey === "home") renderHome();
      else if (pageKey === "stores") renderStores();
      else renderPlaceholder(pageKey);
    }

    menu.addEventListener("click", event => {
      const button = event.target.closest("button[data-page]");
      if (!button) return;
      navigate(button.dataset.page);
    });

    async function start() {
      if (!window.supabase || !window.supabase.createClient) {
        connectionStatus.textContent = "Supabase লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।";
        connectionStatus.className = "status message error";
        navigate("home");
        return;
      }

      try {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const { error } = await db.from("stores").select("id").limit(1);

        if (error) {
          connectionStatus.textContent = "ডেটাবেস সংযোগে সমস্যা: " + error.message;
          connectionStatus.className = "status message error";
        } else {
          connectionStatus.textContent = "Supabase সংযোগ সফল।";
          connectionStatus.className = "status message success";
        }
      } catch (error) {
        console.error("Supabase connection error:", error);
        connectionStatus.textContent = "সংযোগে সমস্যা হয়েছে: " + (error.message || "অজানা সমস্যা");
        connectionStatus.className = "status message error";
      }

      navigate("home");
    }

    start();
  })();
  </script>
</body>
</html>
