
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unity Enterprise হিসাব সফটওয়্যার</title>
  <style>
    :root {
      --navy: #123b65;
      --blue: #1769aa;
      --bg: #f2f5f9;
      --white: #ffffff;
      --text: #243447;
      --muted: #64748b;
      --border: #dce4ee;
      --green: #d1e7dd;
      --red: #f8d7da;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 18px 22px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .9;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: calc(100vh - 85px);
    }

    nav {
      background: #fff;
      padding: 14px;
      border-right: 1px solid var(--border);
    }

    nav button {
      width: 100%;
      display: block;
      text-align: left;
      padding: 12px;
      margin-bottom: 6px;
      background: white;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      color: var(--text);
    }

    nav button:hover,
    nav button.active {
      background: #e8f1fb;
      border-color: #c7d9ef;
      color: var(--navy);
      font-weight: bold;
    }

    main { padding: 24px; min-width: 0; }

    h2 { margin-top: 0; }

    .panel, .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 5px #00000008;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .card p { color: var(--muted); margin: 0 0 10px; }
    .card strong { font-size: 24px; }

    label {
      display: block;
      margin: 13px 0 5px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
      background: white;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid #b8d7f5;
      border-color: var(--blue);
    }

    .btn {
      display: inline-block;
      border: 0;
      border-radius: 6px;
      background: var(--navy);
      color: white;
      padding: 11px 16px;
      margin: 12px 6px 0 0;
      cursor: pointer;
      font: inherit;
    }

    .btn:hover { background: var(--blue); }
    .btn.secondary { background: #526579; }

    .message {
      padding: 10px;
      border-radius: 6px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .message:empty { display: none; }
    .message.success { background: var(--green); }
    .message.error { background: var(--red); }
    .muted { color: var(--muted); }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 500px;
    }

    th, td {
      text-align: left;
      padding: 11px;
      border-bottom: 1px solid var(--border);
    }

    th { background: #edf3f9; }

    .status {
      margin-top: 12px;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      nav button { margin: 0; font-size: 13px; }
      main { padding: 14px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header h1 { font-size: 20px; }
    }
  </style>
</head>

async function saveProduct(event) {
  event.preventDefault();

  const form = event.currentTarget;
  const message = document.getElementById("productMessage");
  const button = form.querySelector('button[type="submit"]');

  if (!db) {
    showMessage(message, "ডেটাবেস সংযুক্ত নয়।", "error");
    return;
  }

  const productName = document.getElementById("productName").value.trim();
  const flavor = document.getElementById("productFlavor").value.trim();
  const pieces = Number(document.getElementById("piecesPerCarton").value);
  const purchaseCost = Number(document.getElementById("purchaseCost").value);
  const salePrice = Number(document.getElementById("salePrice").value);

  if (!productName || !Number.isInteger(pieces) || pieces < 1 ||
      !Number.isFinite(purchaseCost) || purchaseCost < 0 ||
      !Number.isFinite(salePrice) || salePrice < 0) {
    showMessage(message, "পণ্যের তথ্য সঠিকভাবে লিখুন।", "error");
    return;
  }

  button.disabled = true;

  try {
    const { error } = await db.from("products").insert({
      product_name: productName,
      flavor: flavor || null,
      pieces_per_carton: pieces,
      purchase_cost_per_piece: purchaseCost,
      sale_price_per_piece: salePrice,
      is_active: true
    });

    if (error) throw error;

    form.reset();
    showMessage(message, "পণ্য সফলভাবে সংরক্ষণ হয়েছে।");
    await loadProducts();
  } catch (error) {
    console.error("Save product error:", error);
    showMessage(message, "পণ্য সংরক্ষণ হয়নি: " + (error.message || "অজানা সমস্যা"), "error");
  } finally {
    button.disabled = false;
  }
}

async function loadProducts() {
  const list = document.getElementById("productList");
  if (!list || !db) return;

  list.innerHTML = '<tr><td colspan="5">তালিকা লোড হচ্ছে...</td></tr>';

  try {
    const { data, error } = await db
      .from("products")
      .select("product_name, flavor, pieces_per_carton, purchase_cost_per_piece, sale_price_per_piece")
      .eq("is_active", true)
      .order("product_name");

    if (error) throw error;

    list.innerHTML = "";

    if (!data || data.length === 0) {
      list.innerHTML = '<tr><td colspan="5">এখনো কোনো পণ্য যোগ করা হয়নি।</td></tr>';
      return;
    }

    data.forEach(product => {
      const row = document.createElement("tr");

      [
        product.product_name || "",
        product.flavor || "—",
        product.pieces_per_carton,
        "৳ " + Number(product.purchase_cost_per_piece).toFixed(2),
        "৳ " + Number(product.sale_price_per_piece).toFixed(2)
      ].forEach(value => {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      });

      list.appendChild(row);
    });
  } catch (error) {
    console.error("Load products error:", error);
    list.innerHTML = '<tr><td colspan="5">পণ্যের তালিকা লোড হয়নি। আবার চেষ্টা করুন।</td></tr>';
  }
}

 

function editStore(store) {
  document.getElementById("storeName").value = store.store_name || "";
  document.getElementById("storeOwner").value = store.owner_name || "";
  document.getElementById("storeAddress").value = store.address || "";
  document.getElementById("storeBalance").value = store.opening_balance ?? 0;

  let hiddenId = document.getElementById("editingStoreId");

  if (!hiddenId) {
    hiddenId = document.createElement("input");
    hiddenId.type = "hidden";
    hiddenId.id = "editingStoreId";
    document.getElementById("storeForm").appendChild(hiddenId);
  }

  hiddenId.value = store.id;

  const button = document.querySelector('#storeForm button[type="submit"]');
  if (button) {
    button.textContent = "পরিবর্তন সংরক্ষণ করুন";
  }

  document.getElementById("storeForm").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

async function saveStore(event) {
  event.preventDefault();

  const form = event.currentTarget;
  const message = document.getElementById("storeMessage");
  const button = form.querySelector('button[type="submit"]');

  if (!db) {
    showMessage(message, "ডেটাবেস সংযুক্ত নয়। সংযোগ পরীক্ষা করুন।", "error");
    return;
  }

  const storeName = document.getElementById("storeName").value.trim();
  const ownerName = document.getElementById("storeOwner").value.trim();
  const address = document.getElementById("storeAddress").value.trim();
  const balance = Number(document.getElementById("storeBalance").value);
  const editingId = document.getElementById("editingStoreId")?.value;

  if (!storeName) {
    showMessage(message, "দোকানের নাম লিখুন।", "error");
    return;
  }

  if (!Number.isFinite(balance) || balance < 0) {
    showMessage(message, "শুরুর বাকি সঠিকভাবে লিখুন।", "error");
    return;
  }

  const store = {
    store_name: storeName,
    owner_name: ownerName || null,
    address: address || null,
    opening_balance: balance
  };

  button.disabled = true;

  try {
    let result;

    if (editingId) {
      result = await db
        .from("stores")
        .update(store)
        .eq("id", editingId);
    } else {
      result = await db
        .from("stores")
        .insert({
          ...store,
          is_active: true
        });
    }

    if (result.error) {
      throw result.error;
    }

    form.reset();

    const hiddenId = document.getElementById("editingStoreId");
    if (hiddenId) {
      hiddenId.value = "";
    }

    button.textContent = "দোকান সংরক্ষণ করুন";

    showMessage(
      message,
      editingId
        ? "দোকানের তথ্য সফলভাবে পরিবর্তন হয়েছে।"
        : "নতুন দোকান সফলভাবে সংরক্ষণ হয়েছে।"
    );

    await loadStores();

    if (typeof loadStoreCount === "function") {
      await loadStoreCount();
    }
  } catch (error) {
    console.error("Store save error:", error);
    showMessage(
      message,
      "সংরক্ষণ করা যায়নি। আবার চেষ্টা করুন।",
      "error"
    );
  } finally {
    button.disabled = false;
  }
}

async function loadStores() {
  const list = document.getElementById("storeList");
  const message = document.getElementById("storeListMessage");
  if (!list || !message) return;

  list.replaceChildren();

  if (!db) {
    list.innerHTML = '<tr><td colspan="4">ডেটাবেস সংযুক্ত নয়।</td></tr>';
    showMessage(message, "Supabase সংযোগ তৈরি হয়নি।", "error");
    return;
  }

  showMessage(message, "দোকানের তালিকা লোড হচ্ছে...");

  try {
    const { data, error } = await db
      .from("stores")
      .select("id, store_name, owner_name, address, opening_balance")
      .order("store_name", { ascending: true });

    if (error) throw error;

    if (!data || data.length === 0) {
      list.innerHTML = '<tr><td colspan="4">এখনও কোনো দোকান যোগ করা হয়নি।</td></tr>';
      showMessage(message, "মোট দোকান: 0", "success");
      return;
    }

    data.forEach(store => {
      const row = document.createElement("tr");

      const nameCell = document.createElement("td");
      nameCell.textContent = store.store_name || "";

      const ownerCell = document.createElement("td");
      ownerCell.textContent = store.owner_name || "উল্লেখ নেই";

      const addressCell = document.createElement("td");
      addressCell.textContent = store.address || "উল্লেখ নেই";

      const balanceCell = document.createElement("td");
      balanceCell.textContent = "৳ " + money(store.opening_balance);

      
const actionCell = document.createElement("td");

const editButton = document.createElement("button");
editButton.type = "button";
editButton.className = "btn";
editButton.textContent = "সম্পাদনা";

editButton.addEventListener("click", () => {
  editStore(store);
});

actionCell.appendChild(editButton);

row.append(nameCell, ownerCell, addressCell, balanceCell, actionCell);

      list.appendChild(row);
    });

    showMessage(message, "মোট দোকান: " + data.length, "success");
  } catch (error) {
    console.error("Load stores error:", error);
    list.innerHTML = '<tr><td colspan="4">তালিকা আনা যায়নি।</td></tr>';
    showMessage(message, "তালিকা লোড হয়নি: " + (error.message || "অজানা সমস্যা"), "error");
  }
}

    async function loadStoreCount() {
      const total = document.getElementById("totalStores");
      if (!total || !db) return;

      try {
        const { count, error } = await db
          .from("stores")
          .select("*", { count: "exact", head: true });

        if (error) throw error;
        total.textContent = count ?? 0;
      } catch (error) {
        console.error("Store count error:", error);
        total.textContent = "—";
      }
    }

    function renderPlaceholder(pageKey) {
      const page = pages[pageKey];
      content.innerHTML = `
        <section class="panel">
          <h3>${escapeHtml(page[0])}</h3>
          <p>${escapeHtml(page[1])}</p>
          <p class="muted">এই মডিউলের পূর্ণ ফর্ম, ডেটাবেস সংরক্ষণ এবং রিপোর্টিং লজিক এখনও যোগ করা হয়নি।</p>
        </section>`;
    }

    function navigate(pageKey) {
      if (!pages[pageKey]) return;

      currentPage = pageKey;
      title.textContent = pages[pageKey][0];

      menu.querySelectorAll("button[data-page]").forEach(button => {
        const active = button.dataset.page === pageKey;
        button.classList.toggle("active", active);
        button.setAttribute("aria-current", active ? "page" : "false");
      });

      if (pageKey === "home") renderHome();
      else if (pageKey === "stores") renderStores();
        else if (pageKey === "products") renderProducts();
      else renderPlaceholder(pageKey);
    }

    menu.addEventListener("click", event => {
      const button = event.target.closest("button[data-page]");
      if (!button) return;
      navigate(button.dataset.page);
    });

    async function start() {
      if (!window.supabase || !window.supabase.createClient) {
        connectionStatus.textContent = "Supabase লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।";
        connectionStatus.className = "status message error";
        navigate("home");
        return;
      }

      try {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const { error } = await db.from("stores").select("id").limit(1);

        if (error) {
          connectionStatus.textContent = "ডেটাবেস সংযোগে সমস্যা: " + error.message;
          connectionStatus.className = "status message error";
        } else {
          connectionStatus.textContent = "Supabase সংযোগ সফল।";
          connectionStatus.className = "status message success";
        }
      } catch (error) {
        console.error("Supabase connection error:", error);
        connectionStatus.textContent = "সংযোগে সমস্যা হয়েছে: " + (error.message || "অজানা সমস্যা");
        connectionStatus.className = "status message error";
      }

      navigate("home");
    }

    start();
  })();
  </script>
</body>
